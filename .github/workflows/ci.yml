name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-${{ runner.os }}-${{ hashFiles('.bazelversion', 'MODULE.bazel') }}-${{ github.sha }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ hashFiles('.bazelversion', 'MODULE.bazel') }}-
            bazel-${{ runner.os }}-

      # Bazelisk is preinstalled as `bazel` and uses the version in .bazelversion.
      # -c opt is required until c-data-structures provides definitions for its
      # non-static inline functions.
      - name: Build
        run: bazel build -c opt //...

      - name: Test
        run: bazel test -c opt --test_output=errors //...

  docker:
    name: Build dev image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t zinnia-dev zinnia/docker
